name: Add issue to iTop Cloud

'on':
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Add issue to the shared iTop Cloud project
        env:
          GH_TOKEN: ${{ secrets.ITOP_PROJECT_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh project item-add 3 --owner rudnerbjoern --url "$ISSUE_URL"
